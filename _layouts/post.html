---
layout: blog
---

<article class="post wrap">
  <a class="post-back label" href="/blog/">← Writing</a>

  <header class="post-header" data-reveal>
    <div class="post-meta">
      <time class="label" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.categories.size > 0 %}
      <span class="post-cats">
        {% for category in page.categories %}
        <span class="tag">{{ category }}</span>
        {% endfor %}
      </span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="post-lead">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-foot">
    <a class="post-back label" href="/blog/">← Back to Writing</a>
  </footer>
</article>
